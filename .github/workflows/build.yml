name: Build ReggaLink V3
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install deps
      run: pip install pyinstaller pillow
    - name: Convert icon
      run: python -c "from PIL import Image; img=Image.open('icon.jpg'); img=img.convert('RGBA'); img.save('icon.ico', sizes=[(256,256),(128,128),(64,64),(32,32)])"
    - name: Build EXE
      run: pyinstaller --onefile --windowed --icon=icon.ico -n ReggaLink_V3 ReggaLink_Ultimate.py
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: ReggaLink-V3-EXE
        path: dist/ReggaLink_V3.exe
