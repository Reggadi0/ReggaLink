name: Build ReggaLink V3 EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name="ReggaLink_V3_by_Reggadi" ReggaLink_Ultimate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReggaLink-V3-EXE
          path: dist/
